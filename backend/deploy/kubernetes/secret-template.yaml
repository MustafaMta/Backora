# TEMPLATE ONLY — never commit real values. Create the secret from your secret manager, e.g.:
#   kubectl -n backora create secret generic backora-secrets \
#     --from-literal=owner-connection-string='Host=pg;Database=backora;Username=backora_owner;Password=…;SSL Mode=VerifyFull' \
#     --from-literal=app-connection-string='Host=pg;Database=backora;Username=backora_app;Password=…;SSL Mode=VerifyFull' \
#     --from-literal=encryption-key="$(openssl rand -base64 32)" \
#     --from-literal=jwt-signing-key="$(openssl rand -base64 48)"
apiVersion: v1
kind: Secret
metadata:
  name: backora-secrets
type: Opaque
stringData:
  owner-connection-string: "<set out-of-band>"
  app-connection-string: "<set out-of-band>"
  encryption-key: "<base64 32 bytes>"
  jwt-signing-key: "<base64 >= 32 bytes>"
---
# Frontend: encrypts the cookie/session key ring at rest on its volume.
#   kubectl -n backora create secret generic backora-frontend \
#     --from-literal=DataProtection__KeyEncryptionKey="$(openssl rand -base64 32)"
# Keep it: replacing it makes the stored key ring unreadable, which signs everyone out once.
apiVersion: v1
kind: Secret
metadata:
  name: backora-frontend
type: Opaque
stringData:
  DataProtection__KeyEncryptionKey: "<base64 32 bytes>"
